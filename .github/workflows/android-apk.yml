name: Build signed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and verify signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -eu
          test -n "$KEYSTORE_BASE64"
          test -n "$SIGNING_PASSWORD"
          mkdir -p build/manual
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > build/manual/debug.keystore
          test -s build/manual/debug.keystore
          sh build-debug.sh
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs build/manual/app-debug.apk > build/certificate.txt
          grep -Fx 'Signer #1 certificate SHA-256 digest: cdf605a294f81e9d70c2593529f504bb17292a361179d16e15642b666d9ecf5d' build/certificate.txt
          rm -f build/manual/debug.keystore
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hoc-chu-signed-apk
          path: build/manual/app-debug.apk
          if-no-files-found: error
          retention-days: 30
